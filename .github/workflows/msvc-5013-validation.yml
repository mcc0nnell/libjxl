name: libjxl MSVC issue 5013 validation
on:
  push:
    branches:
      - ci/msvc-5013-validation
permissions:
  contents: read
jobs:
  native-msvc:
    runs-on: windows-2022
    steps:
      - name: Checkout patched source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify intrinsic declaration and SubOverflow with cl.exe
        shell: pwsh
        run: |
          @'
          #include "lib/jxl/base/common.h"
          #include <cstdint>
          #include <climits>
          int main() {
            int32_t out = 0;
            if (jxl::SubOverflow(100, 40, out) || out != 60) return 1;
            if (!jxl::SubOverflow(INT32_MAX, -1, out)) return 2;
            if (!jxl::SubOverflow(INT32_MIN, 1, out)) return 3;
            return 0;
          }
          '@ | Set-Content -Path msvc-probe.cc -Encoding ascii
          $vcvars = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw 'MSVC vcvars64.bat not found' }
          cmd /d /s /c 'call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" >nul && cl /nologo /std:c++17 /EHsc /I. msvc-probe.cc /link /out:msvc-probe.exe && msvc-probe.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile libjxl encoder with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build-msvc -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF -DJPEGXL_ENABLE_TOOLS=OFF -DJPEGXL_ENABLE_JNI=OFF -DJPEGXL_ENABLE_MANPAGES=OFF
          if errorlevel 1 exit /b 1
          cmake --build build-msvc --target jxl_enc-obj --parallel 2
          if errorlevel 1 exit /b 1
